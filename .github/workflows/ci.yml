# CI — full verification (AGENTS.md Definition of done) before any merge into main.
# Trigger: pull requests to main only, drafts excluded. A commit on a branch without a PR,
# or on a Draft PR, runs nothing; "Ready for review" starts the pipeline.
# E2E scope: pull requests run the desktop `chromium` project only (fast gate); the nightly
# schedule and a manual run (workflow_dispatch) run every project, mobile included.
# To make it mandatory in GitHub: Settings → Rules → Rulesets on main → Require status
# checks → "verify" (the job only appears in the list after a first run).
name: CI

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
    schedule:
        - cron: "0 3 * * *"

# A new push to the same PR cancels the run in progress (no useless queue).
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # Build and E2E never call OpenRouter (/api/* mocked in Playwright): no secret.
            NEXT_TELEMETRY_DISABLED: "1"
            # Inlined at build time: with 0 the AI buttons are disabled and the server quota
            # denies every call (429), which breaks the AI E2E specs. Same value as .env.example.
            NEXT_PUBLIC_AI_DAILY_LIMIT: "3"
            # The AI layer is on only when the build sees a key (only a boolean is inlined).
            # Fake value: no spec reaches the provider (browser specs mock /api/*, the
            # server-contract specs stop at validation).
            OPENROUTER_API_KEY: "ci-placeholder-never-sent"
            # A consent-requiring tracker must be configured for the cookie banner (and its
            # E2E) to exist; ads mirror the local .env.local used to write the specs.
            NEXT_PUBLIC_ADS_ENABLED: "true"
            # E2E runs `next start` (NODE_ENV=production) with no Netlify Blobs store: fail-open
            # lets the server-contract specs reach validation. CI ONLY, never in a deployment.
            AI_QUOTA_FAIL_MODE: "open"
            # CorrectAI is French-first: same default locale as production (Netlify).
            NEXT_PUBLIC_DEFAULT_LOCALE: "fr"
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format
              run: npm run format:check

            - name: Unit tests
              run: npm run test

            - name: Build
              run: npm run build

            # Browser binaries cached per Playwright version; the system libraries are
            # reinstalled every run (they live outside the cache).
            - name: Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: pw-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Playwright browser
              if: steps.pw-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system dependencies
              if: steps.pw-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: E2E tests (chromium, pull request)
              if: ${{ github.event_name == 'pull_request' }}
              run: npm run test:e2e -- --project=chromium

            - name: E2E tests (all projects, nightly / manual)
              if: ${{ github.event_name != 'pull_request' }}
              run: npm run test:e2e

            - name: Storybook build
              run: npm run storybook:build

            - name: Audit (informatif)
              run: npm audit --audit-level=high
              continue-on-error: true

            - name: Upload Playwright report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
